name: cfb-recruiter
services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=cfb_recruiter'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=cfb_admin'
    ports:
      - '5433:5432'
    volumes:
      - 'cfb_pgdata:/var/lib/postgresql/data'
volumes:
  cfb_pgdata: